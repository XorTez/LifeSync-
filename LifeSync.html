function deadlineLeft(d){
  if(!d)return null;const diff=new Date(d)-new Date();
  if(diff<=0)return{expired:true};
  return{expired:false,days:Math.floor(diff/86400000),hours:Math.floor((diff%86400000)/3600000),mins:Math.floor((diff%3600000)/60000),secs:Math.floor((diff%60000)/1000)};
}
function dailyLeft(now){
  const e=new Date();e.setHours(23,59,59,999);const d=e-now;
  return{h:Math.floor(d/3600000),m:Math.floor((d%3600000)/60000),s:Math.floor((d%60000)/1000),pct:Math.round(((now.getHours()*60+now.getMinutes())/(24*60))*100)};
}
function weeklyLeft(now){
  const day=now.getDay(),end=new Date(now);
  end.setDate(now.getDate()+(7-day));end.setHours(23,59,59,999);const d=end-now;
  return{d:Math.floor(d/86400000),h:Math.floor((d%86400000)/3600000),m:Math.floor((d%3600000)/60000),pct:Math.round((day/7)*100)};
}

// Matrix rain canvas
function MatrixRain({w=300,h=70}){
  const ref=useRef();
  useEffect(()=>{
    const c=ref.current;if(!c)return;
    const ctx=c.getContext("2d");
    const cols=Math.floor(w/14);
    const drops=Array(cols).fill(1);
    const chars="アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF";
    let raf;
    const draw=()=>{
      ctx.fillStyle="rgba(0,0,0,0.05)";ctx.fillRect(0,0,w,h);
      ctx.fillStyle="#00ff41";ctx.font="12px monospace";
      drops.forEach((y,i)=>{
        const ch=chars[Math.floor(Math.random()*chars.length)];
        ctx.fillStyle=`rgba(0,255,65,${Math.random()*0.7+0.3})`;
        ctx.fillText(ch,i*14,y*14);
        if(y*14>h&&Math.random()>0.975)drops[i]=0;
        drops[i]++;
      });
      raf=requestAnimationFrame(draw);
    };
    draw();return()=>cancelAnimationFrame(raf);
  },[w,h]);
  return React.createElement("canvas",{ref,width:w,height:h,style:{display:"block",width:"100%"}});
}

function Globe({size=80,speed=0.004}){
  const ref=useRef();const ang=useRef(0);
  useEffect(()=>{
    const c=ref.current;if(!c)return;
    const ctx=c.getContext("2d"),W=size,H=size,cx=W/2,cy=H/2,R=W/2-4;
    let raf;
    const draw=()=>{
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle="#00ff41";ctx.lineWidth=0.5;
      const a=ang.current;
      for(let i=1;i<7;i++){const phi=(i/7)*Math.PI,r=R*Math.sin(phi),y=cy-R*Math.cos(phi);ctx.beginPath();ctx.ellipse(cx,y,r*Math.abs(Math.cos(a)),r*0.2,0,0,Math.PI*2);ctx.globalAlpha=0.4;ctx.shadowColor="#00ff41";ctx.shadowBlur=4;ctx.stroke();}
      for(let j=0;j<8;j++){const lon=(j/8)*Math.PI+a;ctx.beginPath();for(let k=0;k<=40;k++){const phi=(k/40)*Math.PI,x=cx+R*Math.sin(phi)*Math.cos(lon),y=cy-R*Math.cos(phi);k===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.globalAlpha=0.45;ctx.stroke();}
      ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.strokeStyle=C.dim;ctx.lineWidth=0.5;ctx.stroke();
      ang.current+=speed;raf=requestAnimationFrame(draw);
    };
    draw();return()=>cancelAnimationFrame(raf);
  },[size,speed]);
  return React.createElement("canvas",{ref,width:size,height:size,style:{display:"block"}});
}

      ),

              React.createElement("button",{onClick:()=>{setItems(p=>p.map(i=>i.id===item.id?{...i,progress:Math.min(i.target,i.progress+1)}:i));addEnergy(ENERGY_PER_PROGRESS,"+PROG: "+item.title.slice(0,12));},style:{background:C.bg3,border:`1px solid ${C.white}`,color:C.white,width:30,height:30,cursor:"pointer",fontSize:16,boxShadow:`0 0 8px ${C.white}44`}},"+"),
              React.createElement("button",{onClick:()=>{const wasDone=item.done;setItems(p=>p.map(i=>i.id===item.id?{...i,done:!i.done}:i));if(!wasDone)addEnergy(ENERGY_PER_DONE,"✓ DONE: "+item.title.slice(0,12));},style:{flex:1,background:item.done?C.bg3:"transparent",border:`1px solid ${item.done?C.mid:C.line}`,color:item.done?C.white:C.dim,height:30,cursor:"pointer",fontSize:7,letterSpacing:2,boxShadow:item.done?`0 0 6px ${C.mid}44`:"none"}},item.done?"↩ REACTIVATE":"✓ MARK DONE")
            )
          );
        })
      ),
      React.createElement("button",{onClick:()=>{setForm({cat:"tasks",title:"",desc:"",progress:0,target:1,unit:"",freq:"daily",deadline:"",prio:"med",note:"",roadmapSteps:[],roadmapDone:[]});setEditId(null);setShowForm(true);},style:{position:"fixed",bottom:20,right:20,width:46,height:46,background:C.white,border:"none",color:C.bg,fontSize:22,cursor:"pointer",fontWeight:900,boxShadow:`0 0 20px ${C.white}66,0 0 40px ${C.hi}33`,zIndex:100}},"+")
    ),

    showForm&&React.createElement("div",{style:{position:"fixed",inset:0,background:"rgba(0,5,1,0.97)",zIndex:300,display:"flex",alignItems:"flex-end"},onClick:()=>setShowForm(false)},
      React.createElement("div",{style:{background:C.bg,border:`1px solid ${C.line}`,padding:14,width:"100%",maxWidth:480,margin:"0 auto",maxHeight:"90vh",overflowY:"auto",position:"relative",boxShadow:`0 -4px 30px ${C.line}`},onClick:e=>e.stopPropagation()},
        React.createElement(Corners,{col:C.mid,sz:10}),
        React.createElement("div",{style:{fontSize:8,letterSpacing:3,color:C.mid,marginBottom:12,textShadow:`0 0 6px ${C.mid}`}},"◈ "+(editId?"EDIT":"NEW")+" // FD_"+hash),
        React.createElement("div",{style:{marginBottom:9}},
          React.createElement("div",{style:{fontSize:7,letterSpacing:2,color:C.dim,marginBottom:4}},"CATEGORY"),
          React.createElement("div",{style:{display:"flex",gap:4,flexWrap:"wrap"}},
            CATS.map(c=>React.createElement("button",{key:c.id,onClick:()=>setForm(f=>({...f,cat:c.id})),style:{padding:"4px 8px",background:"transparent",border:`1px solid ${form.cat===c.id?C.white:C.line}`,color:form.cat===c.id?C.white:C.dim,fontSize:8,cursor:"pointer",boxShadow:form.cat===c.id?`0 0 6px ${C.white}44`:"none"}},c.kanji+" "+c.label))
          )
        ),
        React.createElement("div",{style:{marginBottom:9}},
          React.createElement("div",{style:{fontSize:7,letterSpacing:2,color:C.dim,marginBottom:4}},"FREQUENCY"),
          React.createElement("div",{style:{display:"flex",gap:4}},
            FREQ.map(f=>React.createElement("button",{key:f.id,onClick:()=>setForm(fm=>({...fm,freq:f.id})),style:{flex:1,padding:"5px",background:"transparent",border:`1px solid ${form.freq===f.id?C.white:C.line}`,color:form.freq===f.id?C.white:C.dim,fontSize:8,cursor:"pointer"}},f.sym+" "+f.label))
          )
        ),
        React.createElement("div",{style:{marginBottom:9}},
          React.createElement("div",{style:{fontSize:7,letterSpacing:2,color:C.dim,marginBottom:4}},"PRIORITY"),
          React.createElement("div",{style:{display:"flex",gap:4}},
            PRIO.map(p=>React.createElement("button",{key:p.id,onClick:()=>setForm(f=>({...f,prio:p.id})),style:{flex:1,padding:"5px",background:"transparent",border:`1px solid ${form.prio===p.id?p.col:C.line}`,color:form.prio===p.id?p.col:C.dim,fontSize:8,cursor:"pointer"}},p.label))
          )
        ),
        ...[{k:"title",l:"TITLE *",p:"EX: CITESTE 30 MIN"},{k:"desc",l:"DESCRIPTION",p:"EX: DIMINEATA"},{k:"unit",l:"UNIT",p:"EX: PAGINI / KM / ZILE"}].map(f=>
          React.createElement("div",{key:f.k,style:{marginBottom:8}},
            React.createElement("div",{style:{fontSize:7,letterSpacing:2,color:C.dim,marginBottom:3}},f.l),
            React.createElement("input",{value:form[f.k],onChange:e=>setForm(fm=>({...fm,[f.k]:e.target.value})),placeholder:f.p,style:{width:"100%",background:C.bg1,border:`1px solid ${C.line}`,padding:"7px 9px",color:C.white,fontSize:11,outline:"none",boxSizing:"border-box",caretColor:C.white}})
          )
        ),
        React.createElement("div",{style:{display:"flex",gap:8,marginBottom:8}},
          [{k:"progress",l:"PROGRESS"},{k:"target",l:"TARGET *"}].map(f=>
            React.createElement("div",{key:f.k,style:{flex:1}},
              React.createElement("div",{style:{fontSize:7,letterSpacing:2,color:C.dim,marginBottom:3}},f.l),
              React.createElement("input",{type:"number",value:form[f.k],onChange:e=>setForm(fm=>({...fm,[f.k]:e.target.value})),style:{width:"100%",background:C.bg1,border:`1px solid ${C.line}`,padding:"7px 9px",color:C.white,fontSize:11,outline:"none",boxSizing:"border-box"}})
            )
          )
        ),
        React.createElement("div",{style:{marginBottom:8}},
          React.createElement("div",{style:{fontSize:7,letterSpacing:2,color:C.dim,marginBottom:3}},"DEADLINE"),
          React.createElement("input",{type:"date",value:form.deadline,onChange:e=>setForm(fm=>({...fm,deadline:e.target.value})),style:{width:"100%",background:C.bg1,border:`1px solid ${C.line}`,padding:"7px 9px",color:C.white,fontSize:11,outline:"none",boxSizing:"border-box",colorScheme:"dark"}})
        ),
        React.createElement("div",{style:{marginBottom:8}},
          React.createElement("div",{style:{fontSize:7,letterSpacing:2,color:C.dim,marginBottom:3}},"MILESTONES (one per line)"),
          React.createElement("textarea",{value:(form.roadmapSteps||[]).join("\n"),onChange:e=>{const s=e.target.value.split("\n");setForm(f=>({...f,roadmapSteps:s,roadmapDone:s.map((_,i)=>f.roadmapDone?.[i]||false)}));},placeholder:"> MILESTONE 1\n> MILESTONE 2",style:{width:"100%",background:C.bg1,border:`1px solid ${C.line}`,padding:"7px 9px",color:C.white,fontSize:10,outline:"none",boxSizing:"border-box",minHeight:60,letterSpacing:1}})
        ),
        React.createElement("div",{style:{marginBottom:12}},
          React.createElement("div",{style:{fontSize:7,letterSpacing:2,color:C.dim,marginBottom:3}},"NOTE"),
          React.createElement("textarea",{value:form.note,onChange:e=>setForm(fm=>({...fm,note:e.target.value})),placeholder:"> OPTIONAL NOTE_",style:{width:"100%",background:C.bg1,border:`1px solid ${C.line}`,padding:"7px 9px",color:C.white,fontSize:10,outline:"none",boxSizing:"border-box",minHeight:40,letterSpacing:1}})
        ),
        React.createElement("button",{onClick:saveItem,style:{width:"100%",padding:12,background:form.title&&form.target?C.white:"transparent",border:`1px solid ${form.title&&form.target?C.white:C.line}`,color:form.title&&form.target?C.bg:C.dim,fontSize:10,letterSpacing:4,cursor:"pointer",fontWeight:900,boxShadow:form.title&&form.target?`0 0 15px ${C.white}44`:"none"}},"◈ "+(editId?"SAVE CHANGES":"INITIALIZE ENTRY"))
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
